[package]
name = "sudoku-solver-v2"
version = "1.0.0"
edition = "2021"

[dependencies]
# For MVP, we'll keep dependencies minimal
anyhow = "1.0"
thiserror = "1.0"

# For JSON strategy system
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For parallel speculation
rayon = "1.8"

# For logging
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
# For testing
tempfile = "3.8"
